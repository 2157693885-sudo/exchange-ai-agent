<!DOCTYPE html>
<html lang="zh" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* 首屏方向与语种预置：在样式生效前定好 lang/dir，避免语言与排版闪烁 */
(function(){try{var v=localStorage.getItem("ea2_lang");if(!v)return;var c=JSON.parse(v);
if(c&&/^[a-z]{2}$/.test(c)){document.documentElement.lang=c;
document.documentElement.dir=(c==="ar")?"rtl":"ltr";}}catch(e){}})();</script>
<title>学生端 · 来华交流全程助手</title>
<meta name="description" content="按阶段排好的办事清单、到期提醒、校园与生活指引，还有一个随时能问的多语种助手。">
<link rel="stylesheet" href="assets/css/base.css">
<style>
/* =========================================================================
   学生端 v3 · 五板块 + 全局悬浮助手
   ========================================================================= */
:root{--tabbar-h:66px}
body{padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 96px)}

.mod{display:none;padding-top:var(--sp-6);animation:modIn .18s ease-out}
.mod.active{display:block}
@keyframes modIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.mod.active{animation:none}}

.mod-head{margin-bottom:var(--sp-5)}
.mod-head h1{font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.02em;margin:6px 0 6px}
.mod-head p{color:var(--ink-600);font-size:.95rem;line-height:1.72;margin:0;max-width:64ch}

.sec-title{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:700;margin:var(--sp-6) 0 var(--sp-4)}
.sec-title .ico{color:var(--brand-600);display:inline-flex}
.sec-title .ico svg{width:19px;height:19px}
.sec-title .count{margin-left:auto;font-size:.82rem;font-weight:600;color:var(--ink-500)}

.cd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:var(--sp-4)}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-5)}
.cd .k{font-size:.8rem;color:var(--ink-500);margin-bottom:8px;font-weight:600}
.cd .v{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.cd .v small{font-size:.88rem;font-weight:600;color:var(--ink-500);margin-inline-start:4px}
.cd.urgent{border-color:var(--amber-200);background:var(--amber-100)}
.cd.urgent .v{color:var(--amber-700)}
.cd.overdue{border-color:var(--cinnabar-100);background:var(--cinnabar-100)}
.cd.overdue .v{color:var(--cinnabar-600)}
.cd.none .v{font-size:1.05rem;font-weight:600;color:var(--ink-400)}

.todo{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-bottom:10px}
.todo .bar{flex:0 0 4px;align-self:stretch;border-radius:99px;background:var(--brand-600)}
.todo.pri-high .bar{background:var(--cinnabar-500)}
.todo.pri-mid .bar{background:var(--amber-600)}
.todo .tx{flex:1;font-size:.94rem;line-height:1.55}
.todo .mt{font-size:.78rem;color:var(--ink-500);margin-top:5px}
.todo .go{border:0;background:transparent;color:var(--brand-700);font:inherit;font-size:.82rem;font-weight:650;cursor:pointer;padding:4px 6px;border-radius:6px}
.todo .go:hover{background:var(--brand-050)}

.tl{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:var(--sp-4)}
.tl::before{content:"";position:absolute;top:17px;left:9%;right:9%;height:2px;background:var(--ink-100);z-index:0}
.tl-item{position:relative;z-index:1;text-align:center}
.tl-dot{width:34px;height:34px;border-radius:99px;margin:0 auto 10px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--ink-200);color:var(--ink-400)}
.tl-dot svg{width:17px;height:17px}
.tl-item.on .tl-dot{border-color:var(--brand-600);background:var(--brand-600);color:#fff;box-shadow:0 0 0 5px var(--brand-050)}
.tl-item.past .tl-dot{border-color:var(--jade-600);background:var(--jade-100);color:var(--jade-700)}
.tl-item .nm{font-size:.9rem;font-weight:650;color:var(--ink-700)}
.tl-item.on .nm{color:var(--brand-700)}
.tl-item .ds{font-size:.78rem;color:var(--ink-500);margin-top:3px;line-height:1.5}

/* 窄屏：时间轴转竖向，否则横线会横穿换行后的圆点 */
@media(max-width:660px){
  .tl{grid-template-columns:1fr;gap:0}
  .tl::before{top:8px;bottom:20px;left:16px;right:auto;width:2px;height:auto}
  .tl-item{display:grid;grid-template-columns:34px 1fr;column-gap:14px;align-items:start;text-align:start;padding-bottom:20px}
  .tl-dot{margin:0}
  .tl-item .nm{margin-top:6px}
  .tl-item .ds{grid-column:2;margin-top:2px}
}

.emg{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.emg a,.emg .em{display:flex;gap:11px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);text-decoration:none;color:inherit;transition:border-color .25s var(--ease)}
.emg a:hover{border-color:var(--cinnabar-500)}
.emg .num{font-size:1.05rem;font-weight:800;color:var(--cinnabar-600);font-variant-numeric:tabular-nums;min-width:46px}
.emg .lb{font-size:.88rem;font-weight:650}
.emg .nt{font-size:.76rem;color:var(--ink-500);line-height:1.4}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(282px,1fr));gap:var(--sp-4)}
.acc{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.acc-h{display:flex;gap:12px;align-items:flex-start;padding:var(--sp-5);cursor:pointer;user-select:none}
.acc-h:hover{background:var(--bg-alt)}
.acc-ico{flex:0 0 38px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--brand-050);color:var(--brand-600)}
.acc-ico svg{width:19px;height:19px}
.acc-h h3{font-size:1rem;margin:0 0 3px}
.acc-h p{font-size:.85rem;color:var(--ink-500);margin:0;line-height:1.5}
.acc-h .cv{margin-inline-start:auto;color:var(--ink-400);flex:0 0 20px;padding-top:4px;transition:transform .3s var(--ease)}
.acc-h .cv svg{width:20px;height:20px}
.acc.open .acc-h .cv{transform:rotate(180deg)}
.acc-b{display:none;padding:0 var(--sp-5) var(--sp-5);border-top:1px solid var(--line)}
.acc.open .acc-b{display:block}
.acc-b .desc{font-size:.9rem;color:var(--ink-600);line-height:1.7;margin:var(--sp-4) 0 0}
.acc-b .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.acc-b .link{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;color:var(--brand-700);text-decoration:none;padding:6px 11px;border:1px solid var(--brand-200);border-radius:99px}
.acc-b .link:hover{background:var(--brand-050)}
.acc-b .link svg{width:14px;height:14px}
.acc-b .link.dis{color:var(--ink-400);border-color:var(--line);cursor:not-allowed}
.acc-b .dl{font-size:.82rem;color:var(--ink-500);margin-top:9px;line-height:1.6}

.src{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--ink-500);background:var(--bg-alt);border:1px solid var(--line);border-radius:99px;padding:4px 10px;margin-top:11px;max-width:100%}
.src svg{width:13px;height:13px;color:var(--jade-600);flex:0 0 13px}
.src.s3 svg{color:var(--amber-600)}
.src a{color:var(--brand-700);text-decoration:none}
.badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.03em}
.badge-now{background:var(--jade-100);color:var(--jade-700)}
.badge-wait{background:var(--ink-100);color:var(--ink-500)}
.badge-warn{background:var(--amber-100);color:var(--amber-700)}

.tier{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:var(--sp-4);margin-bottom:var(--sp-4)}
.tier .t{border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-5);background:var(--surface)}
.tier .t.cur{border-color:var(--jade-600);background:var(--jade-100)}
.tier .lv{font-size:.75rem;font-weight:800;letter-spacing:.08em;color:var(--ink-400);text-transform:uppercase;margin-bottom:6px}
.tier .t.cur .lv{color:var(--jade-700)}
.tier h4{font-size:.98rem;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tier p{font-size:.85rem;color:var(--ink-600);line-height:1.62;margin:0}

.mine-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:10px}
.mine-item{display:flex;gap:12px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);cursor:pointer;text-align:start;width:100%;font:inherit;color:inherit;transition:border-color .25s var(--ease)}
.mine-item:hover{border-color:var(--brand-600)}
.mine-item .mi{flex:0 0 36px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--brand-050);color:var(--brand-600)}
.mine-item .mi svg{width:18px;height:18px}
.mine-item h4{font-size:.93rem;margin:0 0 2px}
.mine-item p{font-size:.79rem;color:var(--ink-500);margin:0;line-height:1.45}
.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-500)}
.kv .v{font-weight:600;text-align:end}

/* ---- 悬浮助手 ---- */
.fab{position:fixed;inset-inline-end:20px;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 16px);z-index:60;
  display:inline-flex;align-items:center;gap:9px;padding:13px 19px;border:0;border-radius:99px;cursor:pointer;
  background:linear-gradient(135deg,var(--brand-700),var(--jade-700));color:#fff;font:inherit;font-weight:650;font-size:.92rem;
  box-shadow:0 12px 30px -10px rgba(15,60,55,.55);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.fab:hover{transform:translateY(-3px);box-shadow:0 18px 38px -12px rgba(15,60,55,.6)}
.fab svg{width:19px;height:19px}
@media(max-width:899px){
  .fab{width:54px;height:54px;padding:0;gap:0;justify-content:center}
  .fab .fl{display:none}
  .appbar .nav{display:none}
  .brand-sub{display:none}
  .appbar-inner{flex-wrap:wrap;row-gap:6px;padding-block:8px;min-height:0}
  .appbar-tools{width:100%;justify-content:center;margin-left:0}
  .appbar-tools .seg button{padding:8px 9px;font-size:.8rem}
}

.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.open{display:block}
.sheet-mask{position:absolute;inset:0;background:rgba(10,26,24,.46);backdrop-filter:blur(4px)}
.sheet-panel{position:absolute;inset:0;margin:auto;width:min(680px,94%);height:min(80vh,760px);
  background:var(--bg);border-radius:var(--r-xl);border:1px solid var(--line);
  display:flex;flex-direction:column;box-shadow:0 36px 90px -28px rgba(10,26,24,.55);animation:sheetIn .32s var(--ease)}
@keyframes sheetIn{from{transform:translateY(16px) scale(.985);opacity:.5}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet-panel{animation:none}}
@media(max-width:680px){.sheet-panel{inset:0;margin:0;width:100%;height:100dvh;border-radius:0;border:0;box-shadow:none}}
.sheet-h{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h .dot{width:9px;height:9px;border-radius:99px;background:var(--jade-600);flex:0 0 9px;box-shadow:0 0 0 4px var(--jade-100)}
.sheet-h strong{font-size:.98rem}
.sheet-h .x{margin-inline-start:auto;border:0;background:transparent;cursor:pointer;color:var(--ink-500);padding:6px;border-radius:8px;line-height:0}
.sheet-h .x:hover{background:var(--bg-alt)}
.sheet-h .x svg{width:19px;height:19px}
.sheet-b{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;font-size:.9rem;line-height:1.72;padding:12px 15px;border-radius:14px}
.msg.me{align-self:flex-end;background:var(--brand-700);color:#fff;border-end-end-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-end-start-radius:4px}
.msg.ai h4{margin:11px 0 5px;font-size:.92rem}
.msg.ai p{margin:5px 0}
.msg.ai ol,.msg.ai ul{margin:6px 0;padding-inline-start:20px}
.msg.ai li{margin:3px 0}
.msg .srcs{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:.78rem;color:var(--ink-500)}
.msg .srcs b{color:var(--ink-600);font-weight:650}
.msg .rev{margin-top:8px;font-size:.75rem;color:var(--amber-700);display:flex;align-items:center;gap:5px}
.msg .rev svg{width:13px;height:13px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip-q{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font:inherit;font-size:.83rem;cursor:pointer;color:var(--ink-700)}
.chip-q:hover{border-color:var(--brand-600);color:var(--brand-700)}
.sheet-f{display:flex;gap:9px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-f input{flex:1;border:1px solid var(--line);border-radius:99px;padding:11px 17px;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink-800);min-width:0}
.sheet-f input:focus{outline:2px solid var(--brand-600);outline-offset:1px;border-color:transparent}
.sheet-f button{border:0;border-radius:99px;padding:0 18px;background:var(--brand-700);color:#fff;font:inherit;font-weight:650;cursor:pointer}
.sheet-f button:hover{background:var(--brand-800)}
.think{display:flex;gap:5px;align-self:flex-start;padding:13px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.think i{width:6px;height:6px;border-radius:99px;background:var(--ink-300);animation:bl 1.1s infinite}
.think i:nth-child(2){animation-delay:.16s}
.think i:nth-child(3){animation-delay:.32s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ---- 底部标签栏 ---- */
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:70;padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--surface);border-top:1px solid var(--line)}
.tabbar-in{display:flex;max-width:720px;margin:0 auto;height:var(--tabbar-h)}
.tab{flex:1;border:0;background:transparent;cursor:pointer;font:inherit;color:var(--ink-500);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;padding:0;transition:color .22s var(--ease)}
.tab .ico{line-height:0}
.tab .ico svg{width:22px;height:22px}
.tab .lb{font-size:.7rem;font-weight:600}
.tab[aria-selected="true"]{color:var(--brand-700)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--brand-600)}
.tab:hover{color:var(--brand-600)}
.fabbg{position:fixed;inset:0;z-index:55;display:none}

@media(min-width:900px){
  .tabbar{inset-inline:auto;left:50%;transform:translateX(-50%);width:620px;bottom:14px;border:1px solid var(--line);border-radius:99px;box-shadow:0 14px 34px -16px rgba(10,26,24,.35)}
  .tabbar-in{height:58px}
  .tab{margin:5px 4px;border-radius:99px}
  .tab[aria-selected="true"]::before{display:none}
  .tab[aria-selected="true"]{font-weight:700;background:var(--brand-100);color:var(--brand-700)}
  .tab:hover{background:var(--brand-050);color:var(--brand-600)}
  .fab{inset-inline-end:calc(50% - 320px);bottom:calc(58px + 30px)}
  body{padding-bottom:110px}
  .appbar .wrap,main .wrap,.foot .wrap{max-width:620px}
}
@media(min-width:1180px){
  .appbar .wrap,main .wrap,.foot .wrap{max-width:980px}
  .appbar .nav{display:flex}
  .mod{padding-top:var(--sp-8)}
  .mod-head p{font-size:1.02rem}
  .sec-title{font-size:1.12rem;margin:var(--sp-8) 0 var(--sp-4)}
}
</style>
</head>
<body>
<div id="chrome-top"></div>

<main id="main">
  <div class="wrap" style="padding-top:var(--sp-4)">

    <!-- 板块 1 · 首页 -->
    <section class="mod active" id="mod-home" data-mod="home">
      <div class="mod-head">
        <div class="eyebrow" data-i18n="mHome">首页</div>
        <h1 data-i18n="mHomeT">你现在该做什么</h1>
        <p id="homeWelcome"></p>
      </div>
      <div class="searchbar" id="homeSearch" role="button" tabindex="0" aria-label="Ask anything about coming to China">
        <span class="sb-ico" id="sbIco"></span>
        <span class="sb-ph" id="sbPh" data-i18n="homeSearchPh">问任何来华问题：签证、住宿登记、就医、支付…</span>
        <span class="sb-go" id="sbGo" data-i18n="homeAskBtn">提问</span>
      </div>
      <div id="homeNoProfile"></div>
      <div id="homeTripBox"></div>
      <div class="sec-title"><span class="ico" id="iRec"></span><span data-i18n="homeRecommended">这一阶段推荐你关注</span></div>
      <div class="cards" id="recBox"></div>
    </section>

    <!-- 板块 2 · 访华指南 -->
    <section class="mod" id="mod-guide" data-mod="guide">
      <div class="mod-head">
        <div class="eyebrow" data-i18n="mGuide">访华指南</div>
        <h1 data-i18n="mGuideT">按办事顺序走，不漏不错</h1>
        <p data-i18n="guideIntro"></p>
      </div>
      <div class="sec-title"><span class="ico" id="iTl"></span><span data-i18n="homeTimeline">阶段时间轴</span></div>
      <div class="tl" id="tlBox"></div>
      <div id="guideBox"></div>
    </section>

    <!-- 板块 3 · 校园学习 -->
    <section class="mod" id="mod-campus" data-mod="campus">
      <div class="mod-head">
        <div class="eyebrow" data-i18n="mCampus">校园学习</div>
        <h1 data-i18n="mCampusT">把学校系统用起来</h1>
        <p data-i18n="campusIntro"></p>
      </div>
      <div class="sec-title"><span class="ico" id="iTier"></span><span data-i18n="campusTier">对接层级</span></div>
      <div class="tier" id="tierBox"></div>
      <p class="tiny muted" data-i18n="campusTierNote" style="margin-bottom:var(--sp-5)"></p>
      <div class="cards" id="campusBox"></div>
    </section>

    <!-- 板块 4 · 日常生活 -->
    <section class="mod" id="mod-daily" data-mod="daily">
      <div class="mod-head">
        <div class="eyebrow" data-i18n="mDaily">日常生活</div>
        <h1 data-i18n="mDailyT">吃、住、行、医、钱</h1>
        <p data-i18n="dailyIntro"></p>
      </div>
      <div class="cards" id="dailyBox"></div>
      <div class="sec-title"><span class="ico" id="iEmg"></span><span data-i18n="homeEmergency">紧急联系</span></div>
      <div class="emg" id="emgBox"></div>

    </section>

    <!-- 板块 5 · 我的 -->
    <section class="mod" id="mod-mine" data-mod="mine">
      <div class="mod-head">
        <div class="eyebrow" data-i18n="mMine">我的</div>
        <h1 data-i18n="mMineT">你的资料与设置</h1>
        <p data-i18n="mineIntro"></p>
      </div>
      <div class="sec-title"><span class="ico" id="iProf"></span><span data-i18n="profileTitle">建立你的服务画像</span></div>
      <div class="card card-pad-lg" id="profileCard"></div>
      <div class="sec-title"><span class="ico" id="iSet"></span><span data-i18n="mineActions">资料与设置</span></div>
      <div class="mine-grid" id="mineBox"></div>
      <div class="sec-title"><span class="ico" id="iCl"></span><span data-i18n="checklist">办事清单</span></div>
      <div class="card card-pad-lg" id="clCard"></div>
      <div class="sec-title"><span class="ico" id="iPriv"></span><span data-i18n="mPrivacyTitle">隐私与授权</span></div>
      <div class="card card-pad-lg" id="privCard"></div>
    </section>

  </div>
</main>

<button class="fab" id="fab" aria-label="ask">
  <span class="ico" id="iFab"></span><span class="fl" data-i18n="fabAsk">问助手</span>
</button>

<aside class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet-panel">
    <div class="sheet-h">
      <span class="dot"></span>
      <strong data-i18n="agentTitle">助手</strong>
