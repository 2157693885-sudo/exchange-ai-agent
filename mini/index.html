<!DOCTYPE html>
<html lang="zh" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>来华交流全程助手 · 小程序同源体验版</title>
<meta name="description" content="微信小程序端的同源网页体验版：同一份知识库、同一套 Agent 规则引擎、同一份多语种词表。">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="desk-note">
  <b>小程序同源体验版</b> · 与 08_小程序/ 共用同一份内核（MD5 逐字节一致） · 手机端打开即为全屏小程序体验
</div>

<div class="phone">
  <div class="app-screen" id="app">

    <!-- 状态栏 -->
    <div class="statusbar">
      <span class="sb-time">9:41</span>
      <span class="sb-icons" id="sbIcons"></span>
    </div>

    <!-- 导航栏 + 微信胶囊 -->
    <div class="navbar">
      <span class="nav-title" id="navTitle"></span>
      <span class="nav-right">
        <span class="nav-langs" id="navLang"></span>
        <span class="capsule" id="capsule"></span>
      </span>
    </div>

    <!-- 语言条 -->
    <div class="langbar" id="langbar"></div>

    <!-- 页面容器 -->
    <div id="content"><div class="loading"><div class="spinner"></div><span>正在加载同源内核…</span></div></div>

    <!-- 底部 TabBar -->
    <div class="tabbar" id="tabbar"></div>

  </div>
</div>

<script src="assets/js/kernel.bundle.js"></script>
<script>
/* =========================================================================
   index.js — 小程序同源体验版（SPA）
   数据全部取自同源内核 K（K.KB / K.Agent / K.I18N），与 08_小程序 行为一致。
   ========================================================================= */
(function () {
  "use strict";

  /* ---------- 图标 ---------- */
  var IC = {
    signal: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.6 17.5h3v-3h-3zM8.1 17.5h3V12h-3zM13.6 17.5h3V6.5h-3zM19.1 17.5h3V2h-3z"/></svg>',
    wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2.5 9.5a13 13 0 0 1 19 0"/><path d="M5.5 13a8.5 8.5 0 0 1 13 0"/><path d="M8.7 16.4a4 4 0 0 1 6.6 0"/><circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none"/></svg>',
    battery: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="7.5" width="17" height="10" rx="2"/><path d="M21 10.5v4"/><rect x="3.5" y="9.5" width="11" height="6" rx="1" fill="currentColor" stroke="none"/></svg>',
    dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.6"/><path d="M12 8v8M8 12h8"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.6 4.5 5.6v6.2c0 4.6 3.2 8 7.5 9.6 4.3-1.6 7.5-5 7.5-9.6V5.6z"/><path d="M12 8v8M8 12h8" stroke-width="1.6"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/></svg>',
    student: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 4 2.5 9 12 14l9.5-5z"/><path d="M6.5 11.5V17c0 1.4 2.5 2.8 5.5 2.8s5.5-1.4 5.5-2.8v-5.5"/><path d="M21.5 9v5"/></svg>',
    org: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 9h17M9 3.5V9M15 3.5V9M9 15h6"/></svg>',
    matter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17.5" rx="2.5"/><path d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h4"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>'
  };

  /* ---------- 常量（与 08_小程序/pages/student/student.js 一致） ---------- */
  var LANGS = K.I18N ? null : null; /* 下面 boot 后取 KB.LANGS */
  var PURPOSES = [
    { v: "degree", k: "purposeDegree" }, { v: "exchange", k: "purposeExchange" },
    { v: "visiting", k: "purposeVisiting" }, { v: "short", k: "purposeShort" },
    { v: "transit", k: "purposeTransit" }
  ];
  var DURATIONS = [
    { v: "lt180", k: "durLt180" }, { v: "le180", k: "durLe180" }, { v: "le240", k: "durLe240" }
  ];
  var FAITHS = [
    { v: "none", k: "faithNone" }, { v: "islam", k: "faithIslam" },
    { v: "buddhism", k: "faithBuddhism" }, { v: "christianity", k: "faithChristianity" },
    { v: "hinduism", k: "faithHinduism" }, { v: "judaism", k: "faithJudaism" }
  ];
  var DIETS = [
    { v: "halal", k: "dietHalal" }, { v: "vegetarian", k: "dietVegetarian" },
    { v: "nopork", k: "dietNoPork" }, { v: "nobeef", k: "dietNoBeef" },
    { v: "noalcohol", k: "dietNoAlcohol" }, { v: "allergy", k: "dietAllergy" }
  ];
  var STAGE_ORDER = ["pre", "arrival", "study", "exit"];
  var STAGE_CLS = { pre: "stage-pre", arrival: "stage-arrival", study: "stage-study", exit: "stage-exit" };
  var STAGE_KEY = { pre: "stagePre", arrival: "stageArrival", study: "stageStudy", exit: "stageExit" };
  var TABS = [
    { id: "home", key: "navHome", ico: "home" },
    { id: "student", key: "student", ico: "student" },
    { id: "org", key: "org", ico: "org" },
    { id: "matter", key: "navData", ico: "matter" }
  ];
  var SUB_TITLE = { home: "appName", student: "student", org: "orgTitle", matter: "navData" };

  /* ---------- 状态 ---------- */
  var S = {
    tab: "home",
    lang: "zh",
    profile: null,
    done: {},
    tpl: 0,
    ask: { q: "", running: false, done: false, steps: [], html: "", sources: [], confidence: 0, needReview: false, error: "" },
    matter: null,
    pick: null /* {field, options, cur} */
  };

  function $(sel, root) { return (root || document).querySelector(sel); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function loadProfile() {
    try { return JSON.parse(localStorage.getItem("ea2_mini_profile") || "null"); } catch (e) { return null; }
  }
  function saveProfile(p) {
    try { localStorage.setItem("ea2_mini_profile", JSON.stringify(p)); } catch (e) {}
  }

  /* ---------- Toast ---------- */
  var _toastT = null;
  function toast(msg) {
    var old = $(".toast");
    if (old) old.remove();
    if (_toastT) clearTimeout(_toastT);
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    $("#app").appendChild(el);
    _toastT = setTimeout(function () { el.remove(); }, 1900);
  }

  /* ---------- 渲染：壳 ---------- */
  function renderShell() {
    $("#sbIcons").innerHTML = IC.signal + IC.wifi + IC.battery;
    $("#capsule").innerHTML = IC.dots + '<span class="cap-div"></span>' + IC.plus;
    $("#langbar").innerHTML = K.KB.LANGS.map(function (l) {
      return '<button type="button" class="langchip' + (l.code === S.lang ? " on" : "") + '" data-lang="' + l.code + '">' + esc(l.flag) + "</button>";
    }).join("");
    $("#tabbar").innerHTML = TABS.map(function (tb) {
      return '<div class="tab' + (tb.id === S.tab ? " on" : "") + '" data-tab="' + tb.id + '">' +
        '<span class="tab-ico">' + (IC[tb.ico] || "") + "</span>" +
        '<span class="tab-label">' + esc(K.t(tb.key)) + "</span></div>";
    }).join("");
    $("#navLang").textContent = K.getLang().toUpperCase();
    $("#navTitle").textContent = S.matter && S.tab === "matter" ? esc(currentMatterTitle()) : esc(K.t(SUB_TITLE[S.tab]));
  }

  function currentMatterTitle() {
    if (!S.matter) return "";
    var m = K.KB.matter(S.matter);
    return m ? (S.lang === "zh" ? m.title : (m.title_en || m.title)) : "";
  }

  /* ---------- 渲染：首页 ---------- */
  function renderHome() {
    var KB = K.KB, t = K.t;
    var stages = STAGE_ORDER.map(function (s) {
      return { cls: STAGE_CLS[s], name: t(STAGE_KEY[s]), desc: t(STAGE_KEY[s] + "Desc"), count: KB.mattersByStage(s).length };
    });
    var news = KB.NEWS.slice(0, 3);
    return (
      '<div class="hero-mini">' +
        '<div class="logo"><span class="logo-mark">' + IC.shield + "</span>" +
          "<div><div class=\"h2\">" + esc(t("appName")) + '</div>' +
          '<div class="app-en">' + esc(t("appSub")) + "</div></div></div>" +
        '<div class="tagline">' + esc(t("heroSub")) + "</div>" +
      "</div>" +
      '<div class="stat-grid">' +
        '<div class="stat"><div class="stat-num">' + KB.MATTERS.length + '</div><div class="stat-label">' + esc(t("kbTotal")) + "</div></div>" +
        '<div class="stat"><div class="stat-num">' + (Object.keys(KB.COUNTRY).length - 1) + '+</div><div class="stat-label">' + esc(t("countryTitle")) + "</div></div>" +
        '<div class="stat"><div class="stat-num">' + KB.LANGS.length + '</div><div class="stat-label">' + esc(t("language")) + "</div></div>" +
        '<div class="stat"><div class="stat-num">' + Object.keys(KB.SRC).length + '</div><div class="stat-label">' + esc(t("sourceLabel")) + "</div></div>" +
      "</div>" +
      '<div class="sec-head"><span class="sec-mark"></span><div class="h3">' + esc(t("stages")) + "</div></div>" +
      stages.map(function (s) {
        return '<div class="card card-tight j-card"><span class="stage-bar ' + s.cls + '"></span>' +
          '<div class="j-info"><div class="j-name">' + esc(s.name) + "</div>" +
          '<div class="j-desc">' + esc(s.desc) + "</div></div>" +
          '<span class="badge badge-p2">' + s.count + " " + esc(t("items")) + "</span></div>";
      }).join("") +
      '<div class="sec-head"><span class="sec-mark"></span><div class="h3">' + esc(t("newsTitle")) + "</div></div>" +
      '<div class="card">' + news.map(function (n) {
        return '<div class="news-item"><div class="news-title">' + esc(n.title) + "</div>" +
          '<div class="news-meta"><span class="badge badge-src src-" + n.level + ">' + n.level + '</span><span class="tiny">' + esc(n.date) + "</span></div></div>";
      }).join("") + "</div>" +
      '<div class="note note-info">' + esc(t("disclaimer")) + "</div>"
    );
  }

  /* ---------- 渲染：学生端 ---------- */
  function renderStudent() {
    var t = K.t, KB = K.KB;
    var p = S.profile || { country: "PK", purpose: "degree", duration: "lt180", arrival: "", faith: "none", diet: [] };
    var countryList = Object.keys(KB.COUNTRY).map(function (c) {
      return { code: c, name: S.lang === "zh" ? KB.COUNTRY[c].zh : (KB.COUNTRY[c].en || KB.COUNTRY[c].zh) };
    });
    var pickers = [
      { field: "country", label: t("nationality"), value: (function () { var c = findC(countryList, p.country); return c ? c.name : (countryList[0] || {}).name; })(), opts: countryList.map(function (c) { return c.name; }) },
      { field: "purpose", label: t("purpose"), value: t(keyOf(PURPOSES, p.purpose)), opts: PURPOSES.map(function (x) { return t(x.k); }) },
      { field: "duration", label: t("duration"), value: t(keyOf(DURATIONS, p.duration)), opts: DURATIONS.map(function (x) { return t(x.k); }) },
      { field: "faith", label: t("faith"), value: t(keyOf(FAITHS, p.faith)), opts: FAITHS.map(function (x) { return t(x.k); }) }
    ];
    var html =
      '<div class="card">' +
        '<div class="h2">' + esc(t("profileTitle")) + "</div>" +
        '<div class="small" style="margin-top:6px;margin-bottom:16px">' + esc(t("profileHint")) + "</div>" +
        pickers.map(function (pk) {
          return '<div class="field"><span class="field-label">' + esc(pk.label) + "</span>" +
            '<div class="picker-value" data-pick="' + pk.field + '"><span>' + esc(pk.value) + "</span><span class=\"arrow\">▾</span></div></div>";
        }).join("") +
        '<div class="field"><span class="field-label">' + esc(t("arrivalDate")) + "</span>" +
          '<div class="picker-value" data-pick="date"><span class="' + (p.arrival ? "" : "tiny") + '">' + esc(p.arrival || "YYYY-MM-DD") + "</span><span class=\"arrow\">▾</span></div></div>" +
        '<div class="field"><span class="field-label">' + esc(t("dietNeeds")) + "</span>" +
          '<div class="chip-wrap">' + DIETS.map(function (d) {
            return '<span class="chip' + (p.diet.indexOf(d.v) >= 0 ? " chip-on" : "") + '" data-diet="' + d.v + '">' + esc(t(d.k)) + "</span>";
          }).join("") + "</div></div>" +
        '<div class="btn-row" style="margin-top:16px">' +
          '<button class="btn btn-primary" data-act="gen">' + esc(S.profile ? t("regenerate") : t("generate")) + "</button>" +
          '<button class="btn btn-ghost" style="flex:0 0 32%" data-act="reset">' + esc(t("reset")) + "</button>" +
        "</div></div>";

    if (S.generated) {
      var path = S.path, country = S.country;
      var zh = S.lang === "zh";
      html +=
        '<div class="sec-head"><span class="sec-mark"></span><div class="h3">' + esc(t("pathResult")) + "</div></div>" +
        '<div class="card">' +
          '<div class="row-between"><span class="badge badge-p2">' + esc(t("pathVisa")) + "</span><span class=\"badge badge-src src-S1\">S1</span></div>" +
          '<div class="path-visa" style="margin-top:8px">' + esc(zh ? path.visa : (path.visa_en || path.visa)) + "</div>" +
          '<div class="body" style="margin-top:8px">' + esc(zh ? path.headline : t("checklist") + " ↓") + "</div>" +
          '<div class="note note-danger" style="margin-top:14px;margin-bottom:0"><span class="strong">' + esc(t("pathRisk")) + "：</span>" + esc(zh ? path.key_risk : t("transferHuman")) + "</div>" +
        "</div>" +
        '<div class="card">' +
          '<div class="h3">' + esc(t("countryTitle")) + " · " + esc(country.name) + "</div>" +
          '<div class="kv"><span class="kv-k">' + esc(t("countryFaith")) + "</span><span class=\"kv-v\">" + esc(country.faith) + "</span></div>" +
          '<div class="kv"><span class="kv-k">' + esc(t("countryDiet")) + "</span><span class=\"kv-v\">" + esc(country.diet) + "</span></div>" +
          '<div class="kv"><span class="kv-k">' + esc(t("countryFest")) + "</span><span class=\"kv-v\">" + esc((country.fest || []).join(" · ")) + "</span></div>" +
          '<div class="kv" style="border-bottom:none"><span class="kv-k">' + esc(t("countryTips")) + "</span><span class=\"kv-v\">" + esc((country.tips || []).join("；")) + "</span></div>" +
        "</div>" +
        '<div class="sec-head"><span class="sec-mark"></span><div class="h3">' + esc(t("checklist")) + "</div></div>" +
        '<div class="card card-tight"><div class="row-between"><span class="small">' + esc(t("progress")) + '</span><span class="strong mono">' + S.doneCount + " / " + S.totalCount + "</span></div>" +
          '<div class="prog-track"><div class="prog-fill" style="width:' + (S.totalCount ? (S.doneCount / S.totalCount * 100) : 0) + '%"></div></div></div>' +
        S.groups.map(function (g) {
          return '<div class="card"><div class="row" style="margin-bottom:6px"><span class="stage-bar ' + g.cls + '"></span><div class="h3">' + esc(g.name) + "</div></div>" +
            g.items.map(function (it) {
              var done = !!S.done[it.id];
              return '<div class="task"><span class="task-box' + (done ? " on" : "") + '" data-done="' + it.id + '">' + (done ? "✓" : "") + "</span>" +
                "<div style=\"flex:1\"><div class=\"row-between\"><span class=\"task-title" + (done ? " task-done" : "") + '">' + esc(it.title) + "</span>" +
                '<span class="badge badge-' + (it.pri === "P0" ? "p0" : (it.pri === "P1" ? "p1" : "p2")) + '">' + it.pri + "</span></div>" +
                '<div class="task-meta"><span class="badge badge-' + (it.urgency === "urgent" ? "danger" : (it.urgency === "soon" ? "warn" : "src")) + '">' + esc(it.dateStr || it.deadlineLabel) + "</span>" +
                (it.days !== null ? '<span class="tiny">剩 ' + it.days + " 天</span>" : "") +
                "</div></div></div>";
            }).join("") + "</div>";
        }).join("") +
        '<div class="note note-warn">' + esc(t("aiGenerated")) + "</div>";
    }

    /* 问答 */
    html +=
      '<div class="sec-head"><span class="sec-mark"></span><div class="h3">' + esc(t("askTitle")) + "</div></div>" +
      '<div class="card">' +
        '<textarea class="ask-input" data-ask-input placeholder="' + esc(t("askPlaceholder")) + '" maxlength="200" rows="2">' + esc(S.ask.q) + "</textarea>" +
        '<div class="btn-row" style="margin-top:12px"><button class="btn btn-primary" data-act="ask" ' + (S.ask.running ? "disabled" : "") + ">" + esc(S.ask.running ? t("thinking") : t("askSend")) + "</button></div>" +
        '<div class="quick-wrap">' + (KB.FAQ.slice(0, 4).map(function (f) {
          return '<span class="quick-chip" data-quick="' + esc(f.q) + '">' + esc(f.q) + "</span>";
        }).join("")) + "</div></div>";

    if (S.ask.running) {
      html += '<div class="card"><div class="loading"><div class="spinner"></div><span>' + esc(t("thinking")) + "</span></div></div>";
    }
    if (S.ask.done) {
      html +=
        '<div class="card"><div class="row-between"><div class="h3">' + esc(t("traceTitle")) + "</div>" +
          '<div class="row" style="gap:6px"><span class="badge badge-ok">' + esc(t("confidence")) + " " + S.ask.confidence + '%</span>' +
          (S.ask.needReview ? '<span class="badge badge-warn">' + esc(t("needReview")) + "</span>" : "") + "</div></div>" +
          (S.ask.steps || []).map(function (st) {
            return '<div class="step"><span class="step-dot">' + st.n + "</span><div><div class=\"strong\">" + esc(st.title) + '</div><div class="tiny" style="margin-top:2px">' + esc(st.detail) + "</div></div></div>";
          }).join("") + "</div>" +
        '<div class="card">' + S.ask.html + "</div>" +
        (S.ask.sources && S.ask.sources.length ? '<div class="card"><div class="h3" style="margin-bottom:4px">' + esc(t("sourceLabel")) + "</div>" +
          S.ask.sources.map(function (s) {
            return '<div class="src" data-url="' + esc(s.url || "") + '"><div class="row-between"><span class="src-name">' + esc(s.name) + "</span>" +
              '<span class="badge badge-src src-' + esc(s.level) + '">' + esc(s.level) + "</span></div>" +
              '<div class="tiny" style="margin-top:4px">' + esc(s.org) + " · " + esc(s.checked) + "</div></div>";
          }).join("") + "</div>" : "") +
        (S.ask.needReview ? '<div class="note note-warn">' + esc(t("transferHuman")) + "</div>" : "");
    }
    if (S.ask.error) {
      html += '<div class="note note-danger">' + esc(S.ask.error) + "</div>";
    }
    return html;
  }

  /* ---------- 渲染：机构端 ---------- */
  function renderOrg() {
    var t = K.t, KB = K.KB;
    var tpls = KB.TEMPLATES;
    var countries = Object.keys(KB.COUNTRY).map(function (c) {
      return { code: c, name: S.lang === "zh" ? KB.COUNTRY[c].zh : (KB.COUNTRY[c].en || KB.COUNTRY[c].zh) };
    });
    var s3 = KB.MATTERS.filter(function (m) { return m.source.some(function (k) { return (KB.SRC[k] || {}).level === "S3"; }); }).length;
    var html =
      '<div class="card"><div class="h3">' + esc(t("genContent")) + "</div>" +
        '<div class="small" style="margin:6px 0 14px">' + esc(t("orgSub")) + "</div>" +
        '<div class="field"><span class="field-label">' + esc(t("genTemplate")) + "</span>" +
          tpls.map(function (tp, i) {
            return '<div class="card card-tight tpl-card' + (S.tpl === i ? " on" : "") + '" data-tpl="' + i + '">' +
              '<span class="tpl-radio"></span><div><div class="tpl-name">' + esc(tp.name) + "</div>" +
              '<div class="tpl-desc">' + esc(tp.desc) + "</div></div></div>";
          }).join("") + "</div>" +
        '<div class="field"><span class="field-label">' + esc(t("genCountry")) + "</span>" +
          '<div class="picker-value" data-pick="orgcountry"><span>' + esc(S.orgCountry ? (function () { var c = findC(countries, S.orgCountry); return c ? c.name : ""; })() : t("genCountry")) + '</span><span class="arrow">▾</span></div></div>' +
        '<div class="btn-row"><button class="btn btn-primary" data-act="genorg">' + esc(t("genRun")) + "</button></div>" +
      "</div>";

    if (S.orgPreview) {
      html += '<div class="sec-head"><span class="sec-mark"></span><div class="h3">' + esc(t("genPreview")) + "</div></div>" +
        '<div class="card">' + S.orgPreview + "</div>" +
        '<div class="btn-row"><button class="btn btn-primary" data-act="puborg">' + esc(t("genPublish")) + "</button>" +
        '<button class="btn btn-ghost" data-act="copyorg">' + esc(t("genCopy")) + "</button></div>";
    }

    html +=
      '<div class="sec-head"><span class="sec-mark"></span><div class="h3">' + esc(t("kbManage")) + "</div></div>" +
      '<div class="card">' +
        '<div class="kb-line"><span>' + esc(t("kbTotal")) + '</span><b>' + KB.MATTERS.length + "</b></div>" +
        '<div class="kb-line"><span>' + esc(t("kbS3")) + '</span><b>' + s3 + "</b></div>" +
        '<div class="kb-line" style="border-bottom:none"><span>' + esc(t("kbLastUpdate")) + '</span><b class="mono">' + esc(KB.META.updated || "2026-09") + "</b></div>" +
      "</div>";
    return html;
  }

  /* ---------- 渲染：事项 ---------- */
  function renderMatter() {
    var t = K.t, KB = K.KB;
    if (S.matter) return renderMatterDetail();
    var groups = STAGE_ORDER.map(function (s) {
      return { cls: STAGE_CLS[s], name: t(STAGE_KEY[s]), items: KB.mattersByStage(s) };
    });
    return groups.map(function (g) {
      return '<div class="sec-head" style="margin-top:16px"><span class="sec-mark"></span><div class="h3">' + esc(g.name) + "</div></div>" +
        '<div class="card">' + g.items.map(function (m) {
          var src = m.source.map(function (k) { return KB.SRC[k]; }).filter(Boolean);
          var lv = (src[0] || {}).level || "S2";
          return '<div class="matter-item" data-matter="' + m.id + '"><div style="flex:1">' +
            '<div class="m-title">' + esc(S.lang === "zh" ? m.title : (m.title_en || m.title)) + "</div>" +
            '<div class="m-meta"><span class="badge badge-' + (m.pri === "P0" ? "p0" : (m.pri === "P1" ? "p1" : "p2")) + '">' + m.pri + '</span>' +
            '<span class="badge badge-src src-' + lv + '">' + lv + '</span>' +
            '<span class="tiny">' + esc(m.deadline.label) + "</span></div></div></div>";
        }).join("") + "</div>";
    }).join("");
  }

  function renderMatterDetail() {
    var t = K.t, KB = K.KB;
    var m = KB.matter(S.matter);
    if (!m) return "";
    var srcs = m.source.map(function (k) { return KB.SRC[k]; }).filter(Boolean);
    var zh = S.lang === "zh";
    return (
      '<div class="card"><div class="h2">' + esc(zh ? m.title : (m.title_en || m.title)) + "</div>" +
        '<div class="row" style="gap:6px;margin-top:8px"><span class="badge badge-' + (m.pri === "P0" ? "p0" : (m.pri === "P1" ? "p1" : "p2")) + '">' + m.pri + '</span>' +
        '<span class="badge badge-src src-' + ((srcs[0] || {}).level || "S2") + '">' + ((srcs[0] || {}).level || "S2") + "</span></div>" +
        '<div class="body" style="margin-top:12px">' + esc(zh ? m.summary : (m.summary_en || m.summary)) + "</div></div>" +
      '<div class="card matter-detail">' +
        '<div class="dl-line"><span class="dl-k">' + esc(t("keyDeadline")) + '</span><span>' + esc(m.deadline.label) + "</span></div>" +
        '<div class="dl-line"><span class="dl-k">' + esc(t("channel")) + '</span><span>' + esc(m.channel) + "</span></div>" +
        '<div class="dl-line"><span class="dl-k">' + esc(t("docsNeeded")) + "</span><span>" + m.docs.map(function (d, i) { return (i + 1) + ". " + d; }).join("<br>") + "</span></div>" +
        '<div class="dl-line" style="border-bottom:none"><span class="dl-k">' + esc(t("riskTip")) + '</span><span>' + esc(m.risk) + "</span></div>" +
      "</div>" +
      '<div class="card"><div class="h3" style="margin-bottom:4px">' + esc(t("sourceLabel")) + "</div>" +
        srcs.map(function (s) {
          return '<div class="src" data-url="' + esc(s.url || "") + '"><div class="row-between"><span class="src-name">' + esc(s.name) + "</span>" +
            '<span class="badge badge-src src-' + esc(s.level) + '">' + esc(s.level) + "</span></div>" +
            '<div class="tiny" style="margin-top:4px">' + esc(s.org) + " · " + esc(s.checked) + "</div></div>";
        }).join("") + "</div>" +
      '<div class="btn-row"><button class="btn btn-ghost" data-act="backmatter">' + IC.back + " " + esc(t("backHome")) + "</button></div>"
    );
  }

  /* ---------- 工具 ---------- */
  function keyOf(list, v) {
    for (var i = 0; i < list.length; i++) { if (list[i].v === v) return list[i].k; }
    return list[0].k;
  }
  function findC(list, code) {
    for (var i = 0; i < list.length; i++) { if (list[i].code === code) return list[i]; }
    return null;
  }

  /* ---------- 主渲染 ---------- */
  function render() {
    var t = K.t;
    K.setLang(S.lang);
    var rtl = K.isRTL();
    document.documentElement.lang = S.lang;
    document.documentElement.dir = rtl ? "rtl" : "ltr";
    var screen = $("#app");
    screen.dir = rtl ? "rtl" : "ltr";
    document.title = t("appName") + " · " + t("student") + "体验";

    renderShell();
    var html = "";
    if (S.tab === "home") html = renderHome();
    else if (S.tab === "student") html = renderStudent();
    else if (S.tab === "org") html = renderOrg();
    else html = renderMatter();
    $("#content").innerHTML = html;
  }

  /* ---------- 学生端逻辑（与 08 student.js 一致） ---------- */
  function genPath() {
    var p = S.profile || { country: "PK", purpose: "degree", duration: "lt180", arrival: "", faith: "none", diet: [] };
    var path = K.Agent.decidePath(p);
    var items = K.Agent.buildChecklist(p);
    var groups = STAGE_ORDER.map(function (s) {
      var list = items.filter(function (x) { return x.matter.stage === s; }).map(function (x) {
        return {
          id: x.matter.id, title: S.lang === "zh" ? x.matter.title : (x.matter.title_en || x.matter.title),
          pri: x.matter.pri, deadlineLabel: x.deadline.label, urgency: x.deadline.urgency,
          days: x.deadline.days, dateStr: x.deadline.dateStr, done: !!S.done[x.matter.id]
        };
      });
      return { stage: s, cls: STAGE_CLS[s], name: K.t(STAGE_KEY[s]), count: list.length, items: list };
    }).filter(function (g) { return g.count > 0; });

    var c = K.KB.COUNTRY[p.country] || K.KB.COUNTRY.OTHER;
    var zh = S.lang === "zh";
    S.path = path;
    S.country = {
      name: zh ? c.zh : (c.en || c.zh), faith: zh ? c.faith : (c.faith_en || c.faith),
      diet: zh ? c.diet : (c.diet_en || c.diet),
      fest: (zh ? c.fest : (c.fest_en || c.fest)) || [], tips: (zh ? c.tips : (c.tips_en || c.tips)) || []
    };
    S.groups = groups;
    S.totalCount = items.length;
    S.doneCount = Object.keys(S.done).filter(function (k) { return S.done[k]; }).length;
    S.generated = true;
    saveProfile(p);
    render();
  }

  /* ---------- 问答 ---------- */
  function doAsk(q) {
    if (S.ask.running) return;
    S.ask = { q: q, running: true, done: false, steps: [], html: "", sources: [], confidence: 0, needReview: false, error: "" };
    render();
    var p = S.profile || { country: "PK", purpose: "degree", duration: "lt180", arrival: "", faith: "none", diet: [] };
    K.Agent.askAsync(q, p, S.lang, function (i, st) { S.ask.curStep = st; render(); })
      .then(function (res) {
        S.ask.running = false; S.ask.done = true;
        S.ask.html = res.html; S.ask.sources = res.sources || [];
        S.ask.steps = res.steps || [];
        S.ask.confidence = Math.round((res.confidence || 0) * 100);
        S.ask.needReview = res.needReview;
        render();
      })
      .catch(function (e) { S.ask.running = false; S.ask.error = String(e && e.message || e); render(); });
  }

  /* ---------- 机构端生成 ---------- */
  function genOrg() {
    var t = K.t, KB = K.KB;
    var tpl = KB.TEMPLATES[S.tpl || 0];
    var cc = S.orgCountry || "PK";
    var c = KB.COUNTRY[cc] || KB.COUNTRY.OTHER;
    var zh = S.lang === "zh";
    var name = zh ? c.zh : (c.en || c.zh);
    var secs = zh ? tpl.sections : (tpl.sections_en || tpl.sections);
    var src = (KB.MATTERS.filter(function (m) { return m.applies && m.applies.purposes && m.applies.purposes.indexOf("degree") >= 0; })[0] || {}).source || [];
    var srcs = src.slice(0, 2).map(function (k) { return KB.SRC[k]; }).filter(Boolean);
    var placeholder = zh ? "内容由知识库自动生成" : "Auto-generated from knowledge base";
    S.orgPreview =
      '<div class="h3">' + esc(tpl.name) + " · " + esc(name) + "</div>" +
      '<div class="small" style="margin:6px 0 10px">' + esc(t("aiGenerated")) + "</div>" +
      secs.map(function (s, i) {
        return '<div class="dl-line" style="' + (i === secs.length - 1 ? "border-bottom:none" : "") + '"><span class="dl-k">' + esc(s) + "</span><span>" + esc(placeholder) + "</span></div>";
      }).join("") +
      (srcs.length ? '<div class="row" style="gap:6px;margin-top:10px">' + srcs.map(function (s) {
        return '<span class="badge badge-src src-' + s.level + '">' + s.level + " · " + esc(s.name) + "</span>";
      }).join("") + "</div>" : "");
    render();
  }

  /* ---------- 事件委托 ---------- */
  document.addEventListener("click", function (e) {
    var tgt = e.target;

    var tab = tgt.closest(".tab");
    if (tab && $("#app").contains(tab)) {
      S.tab = tab.dataset.tab; S.matter = null; render(); return;
    }

    var lang = tgt.closest(".langchip");
    if (lang && $("#app").contains(lang)) {
      S.lang = lang.dataset.lang; S.ask = { q: "", running: false, done: false, steps: [], html: "", sources: [], confidence: 0, needReview: false, error: "" };
      render(); return;
    }

    var pick = tgt.closest(".picker-value");
    if (pick && $("#app").contains(pick)) { openPicker(pick.dataset.pick); return; }

    var diet = tgt.closest("[data-diet]");
    if (diet && $("#app").contains(diet)) {
      var v = diet.dataset.diet;
      var cur = (S.profile || { diet: [] }).diet.slice();
      var i = cur.indexOf(v);
      if (i >= 0) cur.splice(i, 1); else cur.push(v);
      S.profile = S.profile || { country: "PK", purpose: "degree", duration: "lt180", arrival: "", faith: "none", diet: [] };
      S.profile.diet = cur;
      render(); return;
    }

    var act = tgt.closest("[data-act]");
    if (act && $("#app").contains(act)) {
      var a = act.dataset.act;
      if (a === "gen") genPath();
      else if (a === "reset") {
        S.profile = null; S.generated = false; S.path = null; S.groups = []; S.done = {};
        try { localStorage.removeItem("ea2_mini_profile"); } catch (err) {}
        render();
      }
      else if (a === "ask") {
        var q = ($(".ask-input") || {}).value || "";
        if (q.trim()) doAsk(q.trim());
      }
      else if (a === "genorg") genOrg();
      else if (a === "puborg") toast(K.t("published"));
      else if (a === "copyorg") { toast(K.t("copied")); }
      else if (a === "backmatter") { S.matter = null; render(); }
      return;
    }

    var quick = tgt.closest(".quick-chip");
    if (quick && $("#app").contains(quick)) {
      $(".ask-input").value = quick.dataset.quick;
      doAsk(quick.dataset.quick); return;
    }

    var tpl = tgt.closest(".tpl-card");
    if (tpl && $("#app").contains(tpl)) {
      S.tpl = Number(tpl.dataset.tpl); render(); return;
    }

    var mi = tgt.closest(".matter-item");
    if (mi && $("#app").contains(mi)) { S.matter = mi.dataset.matter; render(); return; }

    var src = tgt.closest(".src");
    if (src && $("#app").contains(src)) {
      var u = src.dataset.url;
      if (u) window.open(u, "_blank", "noopener");
      return;
    }

    var done = tgt.closest("[data-done]");
    if (done && $("#app").contains(done)) {
      var id = done.dataset.done;
      S.done[id] = !S.done[id];
      S.doneCount = Object.keys(S.done).filter(function (k) { return S.done[k]; }).length;
      render(); return;
    }

    var pc = tgt.closest(".picker-cancel, .picker-done");
    if (pc) { closePicker(); return; }
    var pitem = tgt.closest(".picker-item");
    if (pitem && S.pick) {
      S.pick.cur = Number(pitem.dataset.i);
      applyPick(); closePicker(); return;
    }
    var pmask = tgt.closest(".picker-mask");
    if (pmask && tgt === pmask) { closePicker(); return; }
  });

  /* ---------- Picker ---------- */
  function openPicker(field) {
    var t = K.t, KB = K.KB;
    var opts = [], cur = 0, label = field;
    if (field === "country" || field === "orgcountry") {
      var list = Object.keys(KB.COUNTRY).map(function (c) {
        return { code: c, name: S.lang === "zh" ? KB.COUNTRY[c].zh : (KB.COUNTRY[c].en || KB.COUNTRY[c].zh) };
      });
      opts = list.map(function (c) { return c.name; });
      var curCode = field === "orgcountry" ? (S.orgCountry || "PK") : ((S.profile || {}).country || "PK");
      var ci = 0;
      for (var i = 0; i < list.length; i++) { if (list[i].code === curCode) { ci = i; break; } }
      cur = ci;
      label = field === "orgcountry" ? t("genCountry") : t("nationality");
      S.pick = { field: field, label: label, opts: opts, cur: cur, codes: list.map(function (c) { return c.code; }) };
    } else if (field === "purpose") {
      opts = PURPOSES.map(function (x) { return t(x.k); });
      cur = Math.max(0, PURPOSES.map(function (x) { return x.v; }).indexOf((S.profile || {}).purpose || "degree"));
      S.pick = { field: field, label: t("purpose"), opts: opts, cur: cur, vals: PURPOSES.map(function (x) { return x.v; }) };
    } else if (field === "duration") {
      opts = DURATIONS.map(function (x) { return t(x.k); });
      cur = Math.max(0, DURATIONS.map(function (x) { return x.v; }).indexOf((S.profile || {}).duration || "lt180"));
      S.pick = { field: field, label: t("duration"), opts: opts, cur: cur, vals: DURATIONS.map(function (x) { return x.v; }) };
    } else if (field === "faith") {
      opts = FAITHS.map(function (x) { return t(x.k); });
      cur = Math.max(0, FAITHS.map(function (x) { return x.v; }).indexOf((S.profile || {}).faith || "none"));
      S.pick = { field: field, label: t("faith"), opts: opts, cur: cur, vals: FAITHS.map(function (x) { return x.v; }) };
    } else if (field === "date") {
      /* 日期用简单选择 */
      var d = (S.profile || {}).arrival || "2026-10-01";
      opts = [];
      var dy = new Date();
      for (var k = 0; k < 18; k++) {
        var dd = new Date(dy.getFullYear(), dy.getMonth(), dy.getDate() + k);
        opts.push(dd.getFullYear() + "-" + pad(dd.getMonth() + 1) + "-" + pad(dd.getDate()));
      }
      cur = Math.max(0, opts.indexOf(d));
      S.pick = { field: field, label: t("arrivalDate"), opts: opts, cur: cur < 0 ? 0 : cur, vals: opts };
    }
    renderPicker();
  }

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function renderPicker() {
    var old = $(".picker-mask");
    if (old) old.remove();
    if (!S.pick) return;
    var mask = document.createElement("div");
    mask.className = "picker-mask";
    mask.innerHTML =
      '<div class="picker-panel"><div class="picker-head">' +
        '<span class="cancel">' + esc(K.t("cancel") || "取消") + "</span>" +
        '<span class="done">' + esc(K.t("done") || "完成") + "</span></div>" +
        '<div class="picker-list">' + S.pick.opts.map(function (o, i) {
          return '<div class="picker-item' + (i === S.pick.cur ? " on" : "") + '" data-i="' + i + '">' + esc(o) + "</div>";
        }).join("") + "</div></div>";
    $("#app").appendChild(mask);
  }

  function applyPick() {
    var p = S.profile || { country: "PK", purpose: "degree", duration: "lt180", arrival: "", faith: "none", diet: [] };
    if (S.pick.field === "country") { p.country = S.pick.codes[S.pick.cur]; S.profile = p; }
    else if (S.pick.field === "orgcountry") { S.orgCountry = S.pick.codes[S.pick.cur]; }
    else if (S.pick.field === "purpose") { p.purpose = S.pick.vals[S.pick.cur]; S.profile = p; }
    else if (S.pick.field === "duration") { p.duration = S.pick.vals[S.pick.cur]; S.profile = p; }
    else if (S.pick.field === "faith") { p.faith = S.pick.vals[S.pick.cur]; S.profile = p; }
    else if (S.pick.field === "date") { p.arrival = S.pick.vals[S.pick.cur]; S.profile = p; }
    render();
  }

  function closePicker() {
    S.pick = null;
    var old = $(".picker-mask");
    if (old) old.remove();
  }

  /* ---------- 启动 ---------- */
  K.boot(function () {
    S.profile = loadProfile();
    var saved = S.profile;
    if (saved) genPath(); /* 生成过则恢复路径视图 */
    render();
  });
})();
</script>
</body>
</html>
