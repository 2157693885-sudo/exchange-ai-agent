<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="来华交流全程助手 · 小程序体验版：模拟微信小程序的真机壳体验，与学生端、机构端、门户同源同库。">
<title>来华交流全程助手 · 小程序体验版</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="device" id="device">
  <div class="statusbar" aria-hidden="true">
    <span class="sb-time">9:41</span>
    <span class="sb-right">
      <span class="sb-ico sb-signal"></span>
      <span class="sb-ico sb-wifi"></span>
      <span class="sb-ico sb-batt"></span>
    </span>
  </div>
  <div class="capsule" aria-hidden="true"><span class="cap-dot"></span><span class="cap-bar"></span></div>
  <div class="screen" id="screen">
    <iframe data-page="home" src="../index.html" title="首页"></iframe>
    <iframe data-page="student" src="../student.html" title="学生端" class="on"></iframe>
    <iframe data-page="institution" src="../institution.html" title="机构端"></iframe>
    <iframe data-page="assistant" src="../student.html" title="AI助手"></iframe>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="小程序导航">
    <button type="button" data-page="home">
      <span class="tb-ic tb-home"></span><span class="tb-lb" data-zh="首页" data-en="Home">首页</span>
    </button>
    <button type="button" data-page="student" class="on">
      <span class="tb-ic tb-stu"></span><span class="tb-lb" data-zh="学生端" data-en="Student">学生端</span>
    </button>
    <button type="button" data-page="institution">
      <span class="tb-ic tb-org"></span><span class="tb-lb" data-zh="机构端" data-en="Office">机构端</span>
    </button>
    <button type="button" data-page="assistant">
      <span class="tb-ic tb-ai"></span><span class="tb-lb" data-zh="助手" data-en="AI">助手</span>
    </button>
  </nav>
</div>
<script src="mini-app.js"></script>
</body>
</html>
