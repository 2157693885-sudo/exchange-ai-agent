<!DOCTYPE html>
<html lang="zh" dir="ltr" data-theme="light">
<head>
<script>/* 首屏方向与语种预置：在样式生效前定好 lang/dir，避免语言与排版闪烁 */
(function(){try{var v=localStorage.getItem("ea2_lang");if(!v)return;var c=JSON.parse(v);
if(c&&/^[a-z]{2}$/.test(c)){document.documentElement.lang=c;
document.documentElement.dir=(c==="ar")?"rtl":"ltr";}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>来华交流全程助手 · Exchange AI Agent for China</title>
<meta name="description" content="给来华留学生与高校老师用的来华交流全程助手：学生端按阶段办手续、看提醒，机构端一键生成国别指南与行前清单。">
<link rel="stylesheet" href="assets/css/base.css">
<style>

/* ===== v5 门户：极简产品 landing（图大字少 · 一屏一件事） ===== */
.gate{padding:0 0 var(--sp-10)}

/* hero 满版图，底部 scrim，图上只放 eyebrow + 大标题 */
.gate-hero{position:relative;overflow:hidden}
.gate-hero-media{position:absolute;inset:0}
.gate-hero-media img{width:100%;height:100%;object-fit:cover;object-position:center 28%}
.gate-hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,24,20,0) 36%,rgba(8,24,20,.40) 66%,rgba(7,20,17,.88) 100%)}
.gate-hero-inner{position:relative;z-index:2;min-height:min(74vh,740px);display:flex;flex-direction:column;justify-content:flex-end;padding:var(--sp-16) clamp(28px,8vw,104px) var(--sp-10)}
.gate-hero-inner .eyebrow{color:var(--coral-400);margin-bottom:var(--sp-4)}
.gate-hero-inner h1{color:#fff;font-family:var(--font-serif);font-weight:600;font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.16;letter-spacing:.01em;max-width:22ch;margin:0;text-shadow:0 3px 22px rgba(0,0,0,.45)}

/* 图下 CTA 浅色条 */
.gate-action{background:var(--bg);border-bottom:1px solid var(--line)}
.gate-action-inner{padding:var(--sp-8) clamp(28px,8vw,104px) var(--sp-8);max-width:1200px;margin:0 auto}
.gate-action p{font-size:clamp(1rem,1.4vw,1.12rem);color:var(--ink-600);line-height:1.72;max-width:62ch;margin:0 0 var(--sp-5)}
.gate-cta{display:flex;flex-wrap:wrap;gap:12px}
.gate-cta .btn{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 26px;border-radius:var(--r-full);font-weight:650;font-size:.97rem;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease)}
.gate-cta .btn-primary{background:var(--coral-500);color:#fff;box-shadow:0 14px 30px -14px rgba(206,87,56,.62)}
.gate-cta .btn-primary:hover{transform:translateY(-2px);background:var(--coral-600)}
.gate-cta .btn-ghost{background:var(--surface);color:var(--brand-700);border:1px solid var(--line-strong)}
.gate-cta .btn-ghost:hover{border-color:var(--brand-400);transform:translateY(-2px)}
.gate-cta .ico{width:18px;height:18px}

/* 产品预览 */
.showcase{padding:var(--sp-12) 0}
.showcase-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(var(--sp-8),5vw,var(--sp-12));align-items:center}
.showcase-shot{display:flex;justify-content:center;align-items:center;position:relative;min-height:440px;border-radius:var(--r-xl);border:1px solid var(--line);background:linear-gradient(160deg,var(--brand-050),var(--bg) 78%);padding:clamp(24px,3vw,42px)}
.showcase-shot::before{content:"";position:absolute;width:76%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(46,125,91,.10),transparent 70%)}
.phone{position:relative;z-index:1;width:296px;border-radius:44px;padding:9px;background:linear-gradient(180deg,#0f2b24,#081f1a);box-shadow:0 30px 60px -34px rgba(8,30,26,.55),0 3px 10px -4px rgba(8,30,26,.28),inset 0 0 0 1px rgba(255,255,255,.08);zoom:.82}
.phone-screen{position:relative;display:block;width:100%;border-radius:34px;background:#f6f3ee;overflow:hidden;color:#1c2b26;text-align:left}
.pm-notch{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:70px;height:15px;border-radius:0 0 12px 12px;background:#081f1a;z-index:3}
.pm-status{display:flex;justify-content:space-between;align-items:center;padding:10px 15px 4px;font-size:8px;font-weight:700;color:rgba(255,255,255,.94);letter-spacing:.02em;background:linear-gradient(180deg,#123a30,#0d2e26)}
.pm-sig{display:flex;gap:5px;align-items:center}
.pm-sig svg{width:11px;height:11px;fill:currentColor;opacity:.9}
.pm-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 13px 10px;background:linear-gradient(180deg,#123a30,#0c2a23);color:#fff;font-size:8px;letter-spacing:.02em}
.pm-brand{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-langs{font-size:7px;opacity:.72;white-space:nowrap;letter-spacing:.04em}
.pm-body{padding:13px 14px 16px}
.pm-eyebrow{font-size:7px;font-weight:800;letter-spacing:.16em;color:#a08a6e;margin-bottom:6px}
.pm-title{font-size:13px;font-weight:800;color:#14231d;line-height:1.25;margin-bottom:4px}
.pm-sub{font-size:8px;line-height:1.5;color:#5a6b63;margin-bottom:10px}
.pm-search{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid #e2ddd3;border-radius:8px;padding:6px 8px;font-size:7.5px;color:#8a978f;margin-bottom:10px}
.pm-search button{border:0;background:#14503f;color:#fff;font-size:7.5px;font-weight:700;border-radius:6px;padding:4px 9px;cursor:default}
.pm-stage{display:flex;align-items:center;gap:6px;font-size:8px;color:#5a6b63;margin-bottom:10px}
.pm-stage b{color:#14231d}
.pm-stage em{margin-left:auto;color:#a08a6e;font-style:normal}
.pm-prog{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e2ddd3;border-radius:9px;padding:7px 10px;margin-bottom:10px}
.pm-prog b{font-size:8px;color:#14503f;white-space:nowrap}
.pm-prog .bar{flex:1;height:5px;border-radius:3px;background:#e8e4da;overflow:hidden}
.pm-prog .bar i{display:block;height:100%;width:25%;background:#14503f;border-radius:3px}
.pm-prog span{font-size:7px;color:#8a978f;white-space:nowrap}
.pm-tip{display:flex;gap:7px;align-items:flex-start;background:#f0f6f1;border:1px solid #dceadf;border-radius:9px;padding:8px 10px;margin-bottom:8px}
.pm-tip svg{width:12px;height:12px;flex:0 0 12px;color:#14503f;margin-top:1px}
.pm-tip div{font-size:7.5px;color:#43604f;line-height:1.5}
.pm-more{display:block;text-align:center;font-size:7.5px;font-weight:700;color:#14503f;padding:1px 0 4px}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.pm-g{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #e2ddd3;border-radius:9px;padding:7px 9px}
.pm-g svg{width:13px;height:13px;flex:0 0 13px;color:#14503f}
.pm-g span{font-size:7.5px;font-weight:700;color:#14231d;white-space:nowrap}
.pm-task{background:#fff;border:1px solid #e2ddd3;border-radius:9px;padding:7px 10px;margin-bottom:7px}
.pm-t{font-size:8.5px;font-weight:700;color:#14231d;line-height:1.35}
.pm-d{font-size:7.5px;color:#8a978f;margin-top:2px;line-height:1.4}
.pm-dock{display:flex;justify-content:space-around;align-items:center;background:#fbf9f4;border-top:1px solid #ece6db;padding:7px 2px 4px}
.pm-di{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:6.5px;color:#97a29c;min-width:34px}
.pm-di.on{color:#14503f;font-weight:700}
.pm-di svg{width:13px;height:13px;fill:currentColor}
.pm-homebar{width:86px;height:4px;border-radius:3px;background:#d9d4c9;margin:6px auto 7px}
.showcase h2{font-family:var(--font-serif);font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.24;margin:0 0 var(--sp-4);color:var(--ink-900)}
.showcase .lead{color:var(--ink-600);line-height:1.74;margin:0 0 var(--sp-6)}
.showcase-tags{list-style:none;padding:0;margin:0 0 var(--sp-6);display:flex;flex-direction:column;gap:12px}
.showcase-tags li{display:flex;gap:11px;align-items:flex-start;font-size:.95rem;color:var(--ink-700);line-height:1.5}
.showcase-tags .ico{color:var(--coral-500);flex:0 0 18px;margin-top:2px}
.showcase-tags .ico svg{width:18px;height:18px}
.showcase-more{display:inline-flex;align-items:center;gap:8px;color:var(--brand-700);font-weight:650;text-decoration:none}
.showcase-more svg{width:18px;height:18px;transition:transform .3s var(--ease)}
.showcase-more:hover svg{transform:translateX(4px)}
@media(max-width:880px){.showcase-grid{grid-template-columns:1fr;gap:var(--sp-6)}.showcase{padding:var(--sp-10) 0}.phone{zoom:1;width:min(74vw,300px)}}

/* 四阶段 */
.journey{padding:var(--sp-12) 0;background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.j-head{display:flex;align-items:center;gap:10px;color:var(--ink-500);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 var(--sp-6)}
.j-head::after{content:'';flex:1;height:1px;background:var(--line)}
.j-track{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-5)}
.j-step{position:relative;padding:var(--sp-5);background:#fdfcf9;border:1px solid var(--line);border-radius:16px;transition:border-color .25s var(--ease),box-shadow .25s var(--ease),transform .25s var(--ease)}
.j-step:hover{border-color:var(--brand-400);box-shadow:0 14px 30px -20px rgba(20,80,63,.25);transform:translateY(-2px)}
.j-dot{display:none}
.j-num{display:block;font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--brand-500);margin:0 0 8px}
.j-step h4{font-size:1.02rem;margin:0 0 5px;color:var(--ink-900)}
.j-step p{font-size:.84rem;color:var(--ink-500);margin:0;line-height:1.5;min-height:3em}
@media(max-width:720px){.j-track{grid-template-columns:repeat(2,1fr);gap:var(--sp-4)}.j-step{padding:var(--sp-4)}.j-step p{min-height:0}}
@media(max-width:768px){.gate-hero-inner{min-height:min(58vh,520px)}}

/* 信任窄带 */
.trust{padding:var(--sp-8) 0}
.trust-row{display:flex;flex-wrap:wrap;gap:var(--sp-4) var(--sp-8)}
.trust-row div{display:flex;align-items:center;gap:9px;font-size:.88rem;color:var(--ink-600)}
.trust-row .ico{color:var(--brand-600);flex:0 0 17px}
.trust-row .ico svg{width:17px;height:17px}
@media(max-width:620px){.gate{padding-bottom:var(--sp-8)}}

</style>
</head>
<body>
<div id="chrome-top"></div>

<main id="main">

  <section class="gate">

    <div class="gate-hero reveal">
      <div class="gate-hero-media"><img src="assets/img/hero.jpg" alt="多元国际学生在现代中国大学校园中同行"></div>
      <div class="gate-hero-scrim"></div>
      <div class="gate-hero-inner">
        <div class="eyebrow" data-i18n="gateEyebrow">服务来华交流的全周期智能助手</div>
        <h1 data-i18n="gateTitle">来华那些事，跟着做就行</h1>
      </div>
    </div>

    <div class="gate-action reveal">
      <div class="gate-action-inner">
        <p data-i18n="gateLead">签证、居留、报到、保险、就医、支付——按顺序排好，该办什么、什么时候办，到点提醒。</p>
        <div class="gate-cta">
          <a class="btn btn-primary" href="student.html"><span data-i18n="enterStudent">进入学生端</span><span class="ico" id="cIcoStu"></span></a>
          <a class="btn btn-ghost" href="institution.html"><span data-i18n="enterOrg">进入机构端</span><span class="ico" id="cIcoOrg"></span></a>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="showcase reveal">
        <div class="showcase-grid">
          <div class="showcase-shot"><div class="phone"><div class="phone-screen" id="phoneMock"></div></div></div>
          <div>
            <h2 data-i18n="showTitle">一条带日期的办理路径</h2>
            <p class="lead" data-i18n="showLead">填一次基本信息，每一步按顺序排好，到期前主动提醒。</p>
            <ul class="showcase-tags" id="showTags"></ul>
            <a class="showcase-more" href="student.html"><span data-i18n="showMore">打开学生端看看</span><span class="ico" id="cIcoMore"></span></a>
          </div>
        </div>
      </div>
    </div>

    <div class="journey reveal">
      <div class="wrap" id="journey"></div>
    </div>

    <div class="wrap">
      <div class="trust reveal">
        <div class="trust-row">
          <div><span class="ico" id="tIco1"></span><span data-i18n="trustLang">中 / 英 / 俄 / 阿 / 法 / 西 / 越 / 泰 / 缅 / 马 十语种</span></div>
          <div><span class="ico" id="tIco2"></span><span data-i18n="trustSrc">每条政策附官方来源与更新时间</span></div>
          <div><span class="ico" id="tIco3"></span><span data-i18n="trustLocal">数据仅存本机，不上传</span></div>
        </div>
      </div>
    </div>

  </section>

</main>

<div id="chrome-bottom"></div>

<script src="assets/js/kb.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/i18n-v3.js"></script>
<script src="assets/js/kb-i18n.js"></script>
<script src="assets/js/kb-i18n-ru.js"></script>
<script src="assets/js/kb-i18n-ar.js"></script>
<script src="assets/js/kb-i18n-fr.js"></script>
<script src="assets/js/kb-i18n-es.js"></script>
<script src="assets/js/kb-i18n-vi.js"></script>
<script src="assets/js/kb-i18n-th.js"></script>
<script src="assets/js/kb-i18n-my.js"></script>
<script src="assets/js/kb-i18n-ms.js"></script>
<script src="assets/js/agent.js"></script>
<script src="assets/js/ui.js"></script>
<script>

(function () {
  "use strict";
  var t = UI.L10N.t, I = UI.ICONS;

  document.getElementById("chrome-top").innerHTML = UI.header("home").replace(
    /<nav class="nav"[\s\S]*?<\/nav>/,
    '<nav class="nav" data-i18n-aria="navAria" aria-label="主导航"><a href="index.html" aria-current="page" data-i18n="navHome">' + t("navHome") + "</a></nav>"
  );
  document.getElementById("chrome-bottom").innerHTML = UI.footer("");

  document.getElementById("cIcoStu").innerHTML = I.right;
  document.getElementById("cIcoOrg").innerHTML = I.right;
  document.getElementById("cIcoMore").innerHTML = I.right;
  document.getElementById("tIco1").innerHTML = I.globe;
  document.getElementById("tIco2").innerHTML = I.shield;
  document.getElementById("tIco3").innerHTML = I.lock;

  var TAGS = ["showTag1", "showTag2", "showTag3"];
  function renderTags() {
    document.getElementById("showTags").innerHTML = TAGS.map(function (k) {
      return '<li><span class="ico">' + I.check + "</span><span>" + UI.esc(t(k)) + "</span></li>";
    }).join("");
  }
  renderTags();
  document.addEventListener("langchange", renderTags);
  document.addEventListener("langchange", function () {
    document.getElementById("chrome-bottom").innerHTML = UI.footer("");
  });

  /* 手机 mockup：真实渲染学生端首页，随语言重绘 */
  function renderPhoneMock() {
    var box = document.getElementById("phoneMock");
    if (!box) return;
    var zh = String(window.L10N.current).slice(0, 2) === "zh";
    var t = window.L10N.t;
    var list = [];
    try {
      list = window.Agent.buildChecklist({ country: "PK", purpose: "degree", duration: "lt180", arrival: "2026-10-20" }).slice(0, 4);
    } catch (e) {}
    var tasks = list.map(function (x) {
      var m = x.matter;
      return '<div class="pm-task"><div class="pm-t">' + UI.esc(window.KB.L(m, "title")) + "</div>" +
        '<div class="pm-d">' + UI.esc(window.KB.L(m.deadline, "label")) + "</div></div>";
    }).join("");
    var dock = [["home", "mHome"], ["plane", "mGuide"], ["book", "mCampus"], ["heart", "mDaily"], ["users", "mMine"]].map(function (d, i) {
      return '<div class="pm-di' + (i === 0 ? " on" : "") + '">' + (I[d[0]] || "") + "<span>" + UI.esc(t(d[1])) + "</span></div>";
    }).join("");
    var sig = '<svg viewBox="0 0 24 24"><path d="M3.5 20h2v-4.5h-2zM8.5 20h2V11h-2zM13.5 20h2V7h-2zM18.5 20h2V3h-2z"/></svg>' +
      '<svg viewBox="0 0 24 24"><path d="M12 18.6a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8zM6.9 14.6a7 7 0 0 1 10.2 0M4 10.9a11.5 11.5 0 0 1 16 0"/></svg>' +
      '<svg viewBox="0 0 24 24"><rect x="1.5" y="7.5" width="17" height="10" rx="1.8"/><path d="M20.5 10.5v4"/></svg>';
    box.innerHTML =
      '<div class="pm-notch"></div>' +
      '<div class="pm-status"><span>9:41</span><span class="pm-sig">' + sig + "</span></div>" +
      '<div class="pm-top"><span class="pm-brand">' + (zh ? "来华交流全程助手" : "Exchange AI Agent for China") + "</span>" +
      '<span class="pm-langs">ZH EN RU AR ES VI TH</span></div>' +
      '<div class="pm-body"><div class="pm-eyebrow">HOME</div>' +
      '<div class="pm-title">' + UI.esc(t("mHomeT")) + "</div>" +
      '<div class="pm-sub">' + (zh ? "你好！你正处于来华前阶段，以下按紧急程度排序。" : "Good evening! You are at the Before arrival stage; below is sorted by urgency.") + "</div>" +
      '<div class="pm-search"><span>' + (zh ? "问任何来华问题：签证、住宿登记…" : "Ask anything: visa, accommodation…") + "</span>" +
      "<button>" + (zh ? "提问" : "Ask") + "</button></div>" +
      '<div class="pm-stage"><span>' + UI.esc(t("tripStage")) + "</span><b>" + UI.esc(t("stagePre")) + "</b><em>1/4</em></div>" +
      '<div class="pm-prog"><b>' + (zh ? "本周待办 4 项" : "4 to-dos this week") + "</b><span class=\"bar\"><i></i></span><span>" + (zh ? "已完成 1 项" : "1 done") + "</span></div>" +
      '<div class="pm-tasks">' + tasks + "</div>" +
      '<div class="pm-tip">' + (I.info || "") + "<div>" + (zh ? "小贴士：持 X1 签证入境后须在 30 日内申请居留许可；住宿登记须在入住后 24 小时内完成。" : "Tip: Apply for residence permit within 30 days of entry on an X1 visa; register accommodation within 24 hours of check-in.") + "</div></div>" +
      '<div class="pm-grid">' +
      '<div class="pm-g">' + (I.key || "") + "<span>" + (zh ? "签证办理" : "Visa") + "</span></div>" +
      '<div class="pm-g">' + (I.building || "") + "<span>" + (zh ? "住宿登记" : "Housing") + "</span></div>" +
      '<div class="pm-g">' + (I.heart || "") + "<span>" + (zh ? "就医保险" : "Health") + "</span></div>" +
      '<div class="pm-g">' + (I.plane || "") + "<span>" + (zh ? "出行支付" : "Travel") + "</span></div></div>" +
      '<div class="pm-more">' + (zh ? "查看全部待办" : "View all to-dos") + " →</div></div>" +
      '<div class="pm-dock">' + dock + "</div>" +
      '<div class="pm-homebar"></div>';
  }
  renderPhoneMock();
  document.addEventListener("langchange", renderPhoneMock);

  var J = ["stagePre", "stageArrival", "stageStudy", "stageExit"];
  var JD = ["stagePreDesc", "stageArrivalDesc", "stageStudyDesc", "stageExitDesc"];
  var JC = ["#14503F", "#CE5738", "#1B5E47", "#6C7B74"];
  function renderJourney() {
    document.getElementById("journey").innerHTML =
      '<div class="j-head">' + UI.esc(t("stages")) + "</div>" +
      '<div class="j-track">' + J.map(function (k, i) {
        return '<div class="j-step"><span class="j-num">0' + (i + 1) + "</span>" +
          "<h4>" + UI.esc(t(k)) + "</h4><p>" + UI.esc(t(JD[i])) + "</p></div>";
      }).join("") + "</div>";
  }
  renderJourney();
  document.addEventListener("langchange", renderJourney);

  UI.initReveal();
  UI.bindChrome();
})();

</script>
</body>
</html>
